spring.application.name=javabasics

spring.datasource.url=jdbc:postgresql://localhost:5432/javabasics
spring.datasource.username=javabasics
spring.datasource.password=javabasics

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Make SQL visible: the class is about what JPA does behind the scenes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
